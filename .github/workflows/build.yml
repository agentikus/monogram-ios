name: Build Monogram iOS

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master, xcode26-stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Inject API Credentials (if provided in secrets)
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            python3 -c "
          import json
          with open('build-system/appstore-configuration.json', 'r') as f:
              data = json.load(f)
          data['api_id'] = '$API_ID'
          data['api_hash'] = '$API_HASH'
          with open('build-system/appstore-configuration.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
            echo "API credentials injected from secrets."
          else
            echo "Using default build configuration API credentials."
          fi

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          mkdir -p /Users/Shared/bazel-cache
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Restore Bazel Disk Cache
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/bazel-cache
          key: bazel-cache-${{ runner.os }}-x26-${{ github.run_id }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-x26-

      - name: Build Monogram App
        run: |
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          if [ -f build_number_override ]; then COMMIT_COUNT="$(cat build_number_override)"; fi
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir=/Users/Shared/bazel-cache \
            build \
            --continueOnError \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64             --generateDsym \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA_PATH="$(readlink -f bazel-bin/Telegram/Telegram.ipa)"
          if [ ! -f "$IPA_PATH" ]; then
            IPA_PATH="$(find -L bazel-out -name Telegram.ipa -path '*opt*' | head -1)"
          fi
          echo "IPA: $IPA_PATH"
          cp "$IPA_PATH" $OUTPUT_PATH/Monogram.ipa

      - name: Symbolicate hot frames
        continue-on-error: true
        run: |
          cd /Users/Shared/telegram-ios
          mkdir -p /tmp/dsyms && cd /tmp/dsyms
          unzip -q -o /Users/Shared/telegram-ios/build/dsym-out/Telegram.DSYMs.zip || true
          python3 - <<'PY'
          import json, subprocess, glob, re, os
          frames = json.load(open('/Users/Shared/telegram-ios/tools/hot_frames.json'))
          byuuid = {}
          for f in frames:
              byuuid.setdefault(f['uuid'].upper(), []).append(f)
          found = set()
          for dwarf in glob.glob('/tmp/dsyms/**/Contents/Resources/DWARF/*', recursive=True):
              out = subprocess.run(['dwarfdump', '--uuid', dwarf], capture_output=True, text=True).stdout
              for m in re.finditer(r'UUID: ([0-9A-F-]+) \((\w+)\)', out):
                  uuid, arch = m.group(1), m.group(2)
                  print('DSYM', os.path.basename(dwarf), uuid, arch)
                  if uuid not in byuuid or arch != 'arm64':
                      continue
                  found.add(uuid)
                  for f in byuuid[uuid]:
                      r = subprocess.run(['atos', '-o', dwarf, '-arch', 'arm64', '-l', '0x0', hex(f['offset'])], capture_output=True, text=True)
                      print('HOT', f['samples'], os.path.basename(dwarf), hex(f['offset']), r.stdout.strip())
          print('uuids wanted', sorted(byuuid))
          print('uuids matched', sorted(found))
          PY

      - name: Save Bazel Disk Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /Users/Shared/bazel-cache
          key: bazel-cache-${{ runner.os }}-x26-${{ github.run_id }}

      - name: Encrypt IPA
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
        run: |
          if [ -z "$ARTIFACT_PASSWORD" ]; then
            echo "ARTIFACT_PASSWORD is not set, refusing to upload an unencrypted IPA"
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -md sha256 -iter 200000 -salt -in /Users/Shared/telegram-ios/build/artifacts/Monogram.ipa -out /Users/Shared/telegram-ios/build/artifacts/Monogram.ipa.enc -pass env:ARTIFACT_PASSWORD
          rm -f /Users/Shared/telegram-ios/build/artifacts/Monogram.ipa
          ls -l /Users/Shared/telegram-ios/build/artifacts/

      - name: Upload encrypted IPA
        uses: actions/upload-artifact@v4
        with:
          name: Monogram-IPA-enc
          path: /Users/Shared/telegram-ios/build/artifacts/Monogram.ipa.enc
          if-no-files-found: error

      - name: Delete older artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
